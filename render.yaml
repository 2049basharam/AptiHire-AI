# Render Infrastructure Blueprint Configuration for AptiHire AI Stack
# Architecture: Vercel (Frontend & Next.js API Routes) + Supabase (PostgreSQL 16 pgvector) + Render (Node.js Worker + Redis)

services:
  - type: worker
    name: aptihire-background-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: npx tsx src/services/worker-main.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: aptihire-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: redis
    name: aptihire-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
