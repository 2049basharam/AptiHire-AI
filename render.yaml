# Render Infrastructure Blueprint Configuration for AptiHire AI Worker Services
# Note: Prepared configuration for future deployment. Live Render services are currently UNVERIFIED.

services:
  - type: worker
    name: aptihire-background-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/services/worker-main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
